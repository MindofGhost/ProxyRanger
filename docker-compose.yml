version: "3.9"

services:
  proxy:
    build: .
    container_name: proxyranger
    restart: always
    network_mode: host
    mem_limit: 80M
    dns:
      - 127.0.0.1
    logging:
      driver: "journald"
      options:
        tag: "{{.Name}}"
    volumes:
      - ./cache:/app/cache
      - ./certs:/app/certs
      - ./config.yml:/app/config.yml
